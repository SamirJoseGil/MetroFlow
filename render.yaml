services:
  - type: web
    name: metroflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true
