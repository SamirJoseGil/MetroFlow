# MetroFlow - entorno local con Docker Compose
# Levantar:   docker compose up --build
# Probar:     curl http://localhost:8080/api/health
# Detener:    docker compose down

services:
  api:
    build: .
    container_name: metroflow-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    restart: unless-stopped
