<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MetroFlow — planificador de rutas de la red de transporte del Valle de Aburrá. Grafo real, Dijkstra, BFS, rutas alternativas y laboratorio de algoritmos.">
  <meta name="color-scheme" content="light dark">
  <title>MetroFlow · Planificador de rutas</title>
  <script>
    // Aplica el tema antes del primer pintado para evitar el destello de color.
    (function () {
      try {
        var theme = localStorage.getItem("metroflow-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        /* sin persistencia disponible */
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
